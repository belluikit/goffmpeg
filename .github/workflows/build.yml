name: build

# Builds the FFmpeg artifacts for every supported target.
#
# Runs on GitHub-hosted runners with stock Go from actions/setup-go. The hosted
# images carry Xcode (with the iOS SDKs) and the Android NDK; the jobs below
# install what they do not carry — nasm, mingw-w64 and a pinned llvm-mingw.
# Every belluikit module this needs is public, so nothing here holds or needs
# a credential.
#
# The full matrix is expensive — eleven FFmpeg builds — and those artifacts only
# change when the pinned revision or the configure line does. It therefore runs
# on demand and when the build inputs change. Ordinary pushes get the `bindings`
# and `windows-test` jobs, which exercise the Go code against the published
# modules — macOS for the general case, Windows because the dshow paths and the
# purego bindings have historically regressed there and nowhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so every target is built from identical sources. Bump deliberately.
  FFMPEG_REPO: https://github.com/FFmpeg/FFmpeg.git
  FFMPEG_REF: e2bc6d88cd68184288c16570e04881c3a426a05a
  # llvm-mingw, the toolchain for windows_arm64. Pinned with its digest from
  # the release, so a replaced asset fails the download instead of the build.
  LLVM_MINGW_TAG: "20261006"
  LLVM_MINGW_LINUX_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
  LLVM_MINGW_WINARM_SHA256: 9a835d5179c9f3a5a783c11a7f14062a249b4765dd11add64a66786864e82ab2

jobs:
  # Cheap leg: the Go bindings against the published companion modules. This is
  # what guards day-to-day changes to the bridge and the Go API.
  bindings:
    name: bindings (macOS ARM64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (cgo)
        run: go test -race -count=1 ./...

      # The audio-only build (goffmpeg_novideo), which links the audio codec
      # set (#41): MP3 and WAV, no video, no libswscale. Only its own tests and
      # the codec-set tests run under the tag; the rest expect video.
      - name: Test (cgo, audio only)
        run: go test -count=1 -tags goffmpeg_novideo -run 'NoVideo|AudioSet|TestBuiltCodecsAreTheSet|TestNoDecoderForADPCM|TestCodecSetPlaysWAV|TestLinksSharedFFmpeg' .

      # purego dlopens libgoffmpeg rather than linking it, and a fresh checkout
      # has no dist/ (it is gitignored). Stage the shared library out of the
      # module cache, which also means this exercises the published artifact.
      #
      # The purego leg matters: without a decode test here, a missing or
      # unloadable shared object is invisible — Open fails with "library not
      # loaded", and a test that only checks that a bad path errors still passes.
      #
      # A bridge that loads FFmpeg as shared libraries (#40) finds them in
      # ../shared, so the module's shared/ is staged beside lib/ as well.
      - name: Stage the purego shared library
        run: |
          V=$(go list -m -f '{{.Version}}' github.com/belluikit/goffmpeg-libs/darwin_arm64)
          MOD="$(go env GOMODCACHE)/github.com/belluikit/goffmpeg-libs/darwin_arm64@$V"
          test -f "$MOD/lib/libgoffmpeg.dylib" || { echo "::error::no shared library in $MOD/lib"; exit 1; }
          mkdir -p internal/libav/dist/darwin_arm64/lib
          cp "$MOD/lib/libgoffmpeg.dylib" internal/libav/dist/darwin_arm64/lib/
          if [ -d "$MOD/shared" ]; then
            rm -rf internal/libav/dist/darwin_arm64/shared
            cp -R "$MOD/shared" internal/libav/dist/darwin_arm64/shared
          fi

      - name: Test (purego)
        run: CGO_ENABLED=0 go test -count=1 ./...

  # Whether the expensive matrix should run at all. Only git is needed, so it
  # runs on Linux rather than spending macOS minutes on a diff.
  should-build:
    name: decide
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # patches/ counts: it changes the FFmpeg sources the artifacts are
          # built from, so a patch added without a rebuild ships libraries that
          # do not contain it — silently, since nothing here would notice.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(Makefile|bridge\.c|bridge\.h|bridge_reader\.c|patches/.+\.patch|scripts/.+\.sh|testdata/sharedsmoke/.+|\.github/workflows/build\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FFmpeg build inputs unchanged — skipping the matrix. Use workflow_dispatch to force it."
          fi

  # Apple and Android build on the same image: the NDK cross-compiles from
  # macOS, and the Xcode SDKs are only on macOS.
  #
  # The NDK is chosen once, explicitly, and handed to both the Makefile and the
  # link check. The image carries several NDKs and also exports ANDROID_NDK
  # (its default, not its newest), which the Makefile's `ANDROID_NDK ?=` would
  # pick up — so without this the libraries and the link check could come from
  # different NDKs.
  apple-android:
    name: ${{ matrix.target }}
    needs: should-build
    if: needs.should-build.outputs.run == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin_arm64
          - darwin_amd64
          - ios_arm64
          - iossimulator_arm64
          - android_arm64
          - android_arm
          - android_amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # FFmpeg's x86 assembly (darwin_amd64, android_amd64) needs nasm, which
      # the image does not carry.
      - name: Install build tools
        run: brew install nasm

      - name: Fetch FFmpeg
        run: |
          rm -rf ../ffmpeg && git clone --filter=blob:none "$FFMPEG_REPO" ../ffmpeg
          git -C ../ffmpeg checkout --detach "$FFMPEG_REF"

      # The NDK's prebuilt host directory is darwin-x86_64 even on arm64 hosts
      # (the binaries are universal); fail here, by name, if that ever changes.
      - name: Select the Android NDK
        if: startsWith(matrix.target, 'android_')
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          test -d "$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin" \
            || { echo "::error::no darwin-x86_64 toolchain in NDK '$NDK'"; exit 1; }
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "::notice::using NDK $NDK"

      # The shared libraries apps ship (Player ADR-0037 D3, goffmpeg-libs#14),
      # in both codec sets (#41): media in shared/, audio in shared-audio/.
      # dist checks the configured components against the set's lists
      # (check-components), and ends with check-shared, which fails on a name
      # or dependency the loader would not resolve.
      - name: Build ${{ matrix.target }}
        run: |
          make dist TARGET=${{ matrix.target }} ANDROID_NDK="$ANDROID_NDK"
          make dist TARGET=${{ matrix.target }} SET=audio ANDROID_NDK="$ANDROID_NDK"

      # Decodes a file through the shared libraries alone, where this machine
      # can run the target: macOS natively, the simulator slice in a booted
      # simulator, darwin_amd64 under Rosetta when the image has it. The device
      # and Android slices only link. The last line of the log says "ran" or
      # "linked", and SMOKE_RUN=1 fails rather than falling back to a link.
      - name: Smoke-test the shared libraries ${{ matrix.target }}
        run: |
          case "${{ matrix.target }}" in
            darwin_arm64|iossimulator_arm64) run=1 ;;
            darwin_amd64) run=auto ;;
            *) run=0 ;;
          esac
          for set in media audio; do
            make smoke-shared TARGET=${{ matrix.target }} SET=$set ANDROID_NDK="$ANDROID_NDK" SMOKE_RUN=$run
          done

      # Desktop only: purego dlopens this, and the mobile targets configure
      # FFmpeg with --disable-avdevice and have no purego consumer.
      #
      # darwin_amd64 cross-builds from this arm64 machine — the Makefile picks
      # the -arch, and the shared libraries it links are the ones just built.
      - name: Shared bridge ${{ matrix.target }}
        if: startsWith(matrix.target, 'darwin_')
        run: make bridge-shared TARGET=${{ matrix.target }}

      # actions/checkout cannot place a second repository outside the workspace,
      # and sync-libs alone copies only the libraries — leaving no go.mod for
      # the replace to point at. Cloning the companion repo gives a real module;
      # sync-libs then replaces its libraries and link files with this build's,
      # so the link check validates this build rather than the published one.
      - name: Clone companion modules
        run: |
          rm -rf "$RUNNER_TEMP/libs"
          git clone --depth 1 https://github.com/belluikit/goffmpeg-libs.git "$RUNNER_TEMP/libs"

      # `go build` never links a library package, so a missing system library
      # stays invisible until something links a binary. `go test -c` produces
      # one — this is how the Windows import libraries were found.
      #
      # It links against the libraries just built rather than the published
      # module, so a regression is caught before it is tagged.
      - name: Link check ${{ matrix.target }}
        run: |
          make sync-libs TARGET=${{ matrix.target }} LIBS_REPO="$RUNNER_TEMP/libs"
          go mod edit -replace \
            github.com/belluikit/goffmpeg-libs/${{ matrix.target }}="$RUNNER_TEMP/libs/${{ matrix.target }}"
          case "${{ matrix.target }}" in
            darwin_arm64) export GOOS=darwin GOARCH=arm64 ;;
            darwin_amd64) export GOOS=darwin GOARCH=amd64 ;;
            ios_arm64)
              export GOOS=ios GOARCH=arm64
              SDK=$(xcrun --sdk iphoneos --show-sdk-path)
              CC="$(xcrun -f clang) -arch arm64 -isysroot $SDK -mios-version-min=13.0"
              export CC ;;
            iossimulator_arm64)
              export GOOS=ios GOARCH=arm64 TAGS=iossimulator
              SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
              CC="$(xcrun -f clang) -arch arm64 -isysroot $SDK -mios-simulator-version-min=13.0"
              export CC ;;
            android_*)
              BIN="$ANDROID_NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin"
              export GOOS=android
              case "${{ matrix.target }}" in
                android_arm64) export GOARCH=arm64 CC="$BIN/aarch64-linux-android21-clang" ;;
                android_arm)   export GOARCH=arm GOARM=7 CC="$BIN/armv7a-linux-androideabi21-clang" ;;
                android_amd64) export GOARCH=amd64 CC="$BIN/x86_64-linux-android21-clang" ;;
              esac ;;
          esac
          # A developer shell often exports these pointing at Homebrew, which
          # would supply a different FFmpeg to a cross build.
          unset CGO_CFLAGS CGO_LDFLAGS
          # The binary must load FFmpeg as shared libraries: import each one by
          # the name its loader looks for, and define none of FFmpeg itself.
          # The audio-only build links the audio set from shared-audio/, and
          # nothing of the media set, or a package carrying one set would not
          # load (#40, #41). sync-libs wrote the cgo link files this links
          # with (scripts/gen-libav.sh).
          case "${{ matrix.target }}" in
            android_*) export READELF="$BIN/llvm-readelf" NM="$BIN/llvm-nm" ;;
          esac
          SHARED="$RUNNER_TEMP/libs/${{ matrix.target }}/shared"
          CGO_ENABLED=1 go test -c -o "$RUNNER_TEMP/link.test" ${TAGS:+-tags $TAGS} .
          scripts/check-links.sh ${{ matrix.target }} "$RUNNER_TEMP/link.test" "$SHARED"
          CGO_ENABLED=1 go test -c -o "$RUNNER_TEMP/link-novideo.test" -tags "${TAGS:+$TAGS,}goffmpeg_novideo" .
          scripts/check-links.sh ${{ matrix.target }} "$RUNNER_TEMP/link-novideo.test" "$SHARED-audio" audio
          git checkout go.mod

      # This runner is darwin_arm64, so run the suite against the libraries
      # just built, on both backends, rather than only linking it. The cgo
      # binary finds FFmpeg through its rpath to the module's shared/; purego
      # loads the bridge built above from dist/, which finds FFmpeg in
      # ../shared. The link tests run verbosely, so the log shows they ran.
      - name: Test ${{ matrix.target }}
        if: matrix.target == 'darwin_arm64'
        run: |
          go mod edit -replace \
            github.com/belluikit/goffmpeg-libs/darwin_arm64="$RUNNER_TEMP/libs/darwin_arm64"
          # Prove it: the replace must resolve to the clone, not the cache.
          go list -m -f '{{.Path}} => {{with .Replace}}{{.Dir}}{{end}}' \
            github.com/belluikit/goffmpeg-libs/darwin_arm64
          unset CGO_CFLAGS CGO_LDFLAGS
          go test -race -count=1 ./...
          go test -count=1 -v -run 'TestLinksSharedFFmpeg|TestVideoImportsSwscale' .
          go test -count=1 -v -tags goffmpeg_novideo -run 'NoVideo|AudioSet|TestBuiltCodecsAreTheSet|TestNoDecoderForADPCM|TestCodecSetPlaysWAV|TestLinksSharedFFmpeg' .
          CGO_ENABLED=0 go test -count=1 ./...

      - name: Restore go.mod
        if: always() && matrix.target == 'darwin_arm64'
        run: git checkout go.mod

      - uses: actions/upload-artifact@v7
        with:
          name: libav-${{ matrix.target }}
          path: internal/libav/dist/${{ matrix.target }}
          retention-days: 14

  # linux/amd64 natively, plus both Windows targets cross-built here: mingw-w64
  # covers x86_64, llvm-mingw covers aarch64.
  linux-windows:
    name: ${{ matrix.target }}
    needs: should-build
    if: needs.should-build.outputs.run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux_amd64, windows_amd64, windows_arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # nasm for FFmpeg's x86 assembly, libssl-dev and pkg-config for
      # --enable-openssl on Linux, patch for patches/, mingw-w64 for
      # windows_amd64.
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            nasm pkg-config libssl-dev patch mingw-w64

      # Windows on ARM needs llvm-mingw; the distro's mingw-w64 only targets x86.
      - name: Install llvm-mingw
        if: matrix.target == 'windows_arm64'
        run: |
          ASSET="llvm-mingw-$LLVM_MINGW_TAG-ucrt-ubuntu-22.04-x86_64.tar.xz"
          # GitHub's release download answers 504 now and then (twice in a row
          # on run 42567042426), and one miss fails the leg. The digest check
          # below still catches a bad asset.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/$ASSET" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$ASSET"
          echo "$LLVM_MINGW_LINUX_SHA256  $RUNNER_TEMP/$ASSET" | sha256sum -c -
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf "$RUNNER_TEMP/$ASSET" -C /opt/llvm-mingw --strip-components=1
          /opt/llvm-mingw/bin/aarch64-w64-mingw32-gcc --version

      - name: Fetch FFmpeg
        run: |
          rm -rf ../ffmpeg && git clone --filter=blob:none "$FFMPEG_REPO" ../ffmpeg
          git -C ../ffmpeg checkout --detach "$FFMPEG_REF"

      # The shared libraries, as in the apple-android job. On Windows,
      # check-shared also refuses a DLL that imports one Windows does not ship.
      - name: Build ${{ matrix.target }}
        if: matrix.target != 'linux_amd64'
        run: |
          make dist TARGET=${{ matrix.target }} NPROC="$(nproc)" LLVM_MINGW=/opt/llvm-mingw
          make dist TARGET=${{ matrix.target }} SET=audio NPROC="$(nproc)" LLVM_MINGW=/opt/llvm-mingw

      # Linux is built on Ubuntu 22.04, whose glibc 2.35 is the oldest goffmpeg
      # supports (#44): a shared library needs at least the glibc it was built
      # against, and this runner's Ubuntu 24.04 has 2.39. check-shared and
      # bridge-shared fail a file that needs more than the floor. The smoke
      # test runs there too, so the libraries are shown to load on the floor.
      - name: Build ${{ matrix.target }} on Ubuntu 22.04
        if: matrix.target == 'linux_amd64'
        run: |
          make linux-docker TARGET=linux_amd64 DOCKER_GOALS="dist smoke-shared bridge-shared SMOKE_RUN=1"
          make linux-docker TARGET=linux_amd64 DOCKER_GOALS="dist smoke-shared SET=audio SMOKE_RUN=1"

      # The Windows DLLs only link here; windows-test runs them on Windows.
      - name: Smoke-test the shared libraries ${{ matrix.target }}
        if: startsWith(matrix.target, 'windows_')
        run: |
          for set in media audio; do
            make smoke-shared TARGET=${{ matrix.target }} SET=$set LLVM_MINGW=/opt/llvm-mingw SMOKE_RUN=0
          done

      # The Windows legs test this bridge on a real Windows runner. Linux's was
      # built on Ubuntu 22.04 above.
      - name: Shared bridge ${{ matrix.target }}
        if: startsWith(matrix.target, 'windows_')
        run: make bridge-shared TARGET=${{ matrix.target }} LLVM_MINGW=/opt/llvm-mingw

      # purego dlopens the bridge on machines that have nothing but Windows, so
      # every DLL it imports must ship with Windows, or with the bridge. The test legs cannot catch
      # a stray one: GitHub's Windows runners have MinGW on PATH, and that is
      # how a dependency on libgcc_s_seh-1.dll shipped unnoticed (#26). An
      # empty import list fails too, so a broken read cannot pass as clean.
      - name: Check the bridge's DLL imports
        if: startsWith(matrix.target, 'windows_')
        run: |
          case "${{ matrix.target }}" in
            windows_amd64) OBJDUMP=x86_64-w64-mingw32-objdump ;;
            windows_arm64) OBJDUMP=/opt/llvm-mingw/bin/llvm-objdump ;;
          esac
          DLL=internal/libav/dist/${{ matrix.target }}/lib/libgoffmpeg.dll
          imports=$($OBJDUMP -p "$DLL" | awk '/DLL Name:/{print $3}' | sort -fu)
          if [ -z "$imports" ]; then echo "::error::read no imports from $DLL"; exit 1; fi
          echo "$imports"
          # The FFmpeg DLLs are not Windows', but they ship beside the bridge
          # (#40): allowed by name, and each must be in shared/.
          for dll in $(echo "$imports" | grep -iE -- '-goffmpeg-[0-9]+\.dll$' || true); do
            test -f "internal/libav/dist/${{ matrix.target }}/shared/$dll" \
              || { echo "::error::$DLL imports $dll, which shared/ does not have"; exit 1; }
          done
          bad=$(echo "$imports" | grep -viE '^(api-ms-win-crt-[a-z0-9-]+|avicap32|bcrypt|crypt32|gdi32|kernel32|mfplat|msvcrt|ncrypt|ole32|oleaut32|secur32|shlwapi|user32|ws2_32|(avdevice|avformat|avcodec|swresample|swscale|avutil)-goffmpeg-[0-9]+)\.dll$' || true)
          if [ -n "$bad" ]; then
            echo "::error::$DLL imports DLLs Windows does not ship: $(echo $bad)"
            exit 1
          fi

      # actions/checkout cannot place a second repository outside the workspace,
      # and sync-libs alone copies only the libraries — leaving no go.mod for
      # the replace to point at. Cloning the companion repo gives a real module;
      # sync-libs then replaces its libraries and link files with this build's,
      # so the link check validates this build rather than the published one.
      - name: Clone companion modules
        run: |
          rm -rf "$RUNNER_TEMP/libs"
          git clone --depth 1 https://github.com/belluikit/goffmpeg-libs.git "$RUNNER_TEMP/libs"

      - name: Link check ${{ matrix.target }}
        run: |
          make sync-libs TARGET=${{ matrix.target }} LIBS_REPO="$RUNNER_TEMP/libs"
          go mod edit -replace \
            github.com/belluikit/goffmpeg-libs/${{ matrix.target }}="$RUNNER_TEMP/libs/${{ matrix.target }}"
          case "${{ matrix.target }}" in
            linux_amd64)   export GOOS=linux GOARCH=amd64 ;;
            windows_amd64) export GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc ;;
            windows_arm64) export GOOS=windows GOARCH=arm64 CC=/opt/llvm-mingw/bin/aarch64-w64-mingw32-gcc ;;
          esac
          case "${{ matrix.target }}" in
            windows_amd64) export OBJDUMP=x86_64-w64-mingw32-objdump ;;
            windows_arm64) export OBJDUMP=/opt/llvm-mingw/bin/llvm-objdump ;;
          esac
          unset CGO_CFLAGS CGO_LDFLAGS
          # As in the apple-android link check: shared FFmpeg, by the names the
          # loader looks for, and the audio set alone in the audio-only build.
          SHARED="$RUNNER_TEMP/libs/${{ matrix.target }}/shared"
          CGO_ENABLED=1 go test -c -o "$RUNNER_TEMP/link.test" .
          scripts/check-links.sh ${{ matrix.target }} "$RUNNER_TEMP/link.test" "$SHARED"
          CGO_ENABLED=1 go test -c -o "$RUNNER_TEMP/link-novideo.test" -tags goffmpeg_novideo .
          scripts/check-links.sh ${{ matrix.target }} "$RUNNER_TEMP/link-novideo.test" "$SHARED-audio" audio
          git checkout go.mod

      # This runner is the linux/amd64 target, so run the suite rather than
      # only linking it.
      #
      # The replace has to be re-applied: the link check above reverts go.mod
      # when it finishes, and without it this would link the *published*
      # companion module instead of the FFmpeg this job just built —
      # libav_linux_amd64.go blank-imports goffmpeg-libs/linux_amd64, whose
      # cgo link flags resolve ${SRCDIR} into the module cache.
      #
      # That is the same hole linux_arm64 had. It is worth being blunt about
      # what it costs: a patch to FFmpeg was compiled on that runner and never
      # reached the test binary, so the suite passed while testing a different
      # library, and the wrong conclusion survived two rounds of investigation
      # before anyone looked at where the linker was actually pointing.
      #
      # The suite runs on Ubuntu 22.04, the oldest glibc goffmpeg supports (#44),
      # so it shows the libraries link and load there.
      - name: Test ${{ matrix.target }} on Ubuntu 22.04
        if: matrix.target == 'linux_amd64'
        run: |
          go mod edit -replace \
            github.com/belluikit/goffmpeg-libs/linux_amd64="$RUNNER_TEMP/libs/linux_amd64"
          # Prove it: the replace must resolve to the clone, not the cache.
          go list -m -f '{{.Path}} => {{with .Replace}}{{.Dir}}{{end}}' \
            github.com/belluikit/goffmpeg-libs/linux_amd64
          scripts/linux-floor.sh '
            go test -race -count=1 ./...
            go test -count=1 -v -run "TestLinksSharedFFmpeg|TestVideoImportsSwscale" .
            go test -count=1 -v -tags goffmpeg_novideo -run "NoVideo|AudioSet|TestBuiltCodecsAreTheSet|TestNoDecoderForADPCM|TestCodecSetPlaysWAV|TestLinksSharedFFmpeg" .'

      - name: Restore go.mod
        if: always() && matrix.target == 'linux_amd64'
        run: git checkout go.mod

      - uses: actions/upload-artifact@v7
        with:
          name: libav-${{ matrix.target }}
          path: internal/libav/dist/${{ matrix.target }}
          retention-days: 14

      # The Windows legs test the libraries this job just built, on another
      # machine. Hand them the assembled module — go.mod and the cgo directives
      # from the clone, lib/ from this build — so their replace has a real
      # module to point at.
      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.target, 'windows_')
        with:
          name: libsmod-${{ matrix.target }}
          path: ${{ runner.temp }}/libs/${{ matrix.target }}
          retention-days: 14

  # The Windows artifacts are cross-built on Linux, so nothing above ever
  # executes Windows code — a link check proves the symbols resolve, not that a
  # call works. These legs run the suite on real Windows. The hosted runners
  # have no camera, so the dshow capture tests skip here (loudly, with -v).
  #
  # Runs on every push. When the matrix ran, it tests the libraries just built,
  # so a bridge regression is caught before it is tagged; otherwise it tests the
  # published ones, which is what a Go-only change should be measured against
  # anyway. That distinction matters: the last two Windows bugs (#6's int return
  # width, and the symbol lookup that would not compile) were both in Go code,
  # and a Go-only change does not trigger the matrix — so a Windows leg gated on
  # the matrix would not have caught them.
  #
  # always() is needed because linux-windows is skipped on the fallback path,
  # and a skipped dependency would otherwise skip this too — but a matrix that
  # ran and *failed* must still stop this, or a broken build would be reported
  # green by testing the published libraries instead.
  windows-test:
    name: test ${{ matrix.target }}
    needs: linux-windows
    if: >-
      always()
      && needs.linux-windows.result != 'failure'
      && needs.linux-windows.result != 'cancelled'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_amd64
            runner: windows-2025
            # mingw-w64 from the image (runner-images Install-Mingw64.ps1).
            cc: C:\mingw64\bin\gcc.exe
            # The same compiler, spelled for Git Bash.
            smoke_cc: C:/mingw64/bin/gcc.exe
          - target: windows_arm64
            runner: windows-11-arm
            # Installed by the llvm-mingw step below.
            cc: C:\llvm-mingw\bin\clang.exe
            smoke_cc: C:/llvm-mingw/bin/clang.exe
    env:
      LIBS_MOD: github.com/belluikit/goffmpeg-libs/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # The arm64 image has no mingw toolchain; llvm-mingw's native aarch64
      # build is what cgo compiles with there.
      - name: Install llvm-mingw
        if: matrix.target == 'windows_arm64'
        shell: pwsh
        run: |
          $asset = "llvm-mingw-$env:LLVM_MINGW_TAG-ucrt-aarch64"
          $zip = Join-Path $env:RUNNER_TEMP "$asset.zip"
          # Retries for the same intermittent 504 as the Linux download.
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_TAG/$asset.zip" -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 15
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne $env:LLVM_MINGW_WINARM_SHA256) { throw "llvm-mingw digest mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath C:\
          Move-Item "C:\$asset" C:\llvm-mingw
          & C:\llvm-mingw\bin\clang.exe --version

      - name: Download the freshly built libraries
        if: needs.linux-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: libsmod-${{ matrix.target }}
          path: ${{ runner.temp }}\libs\${{ matrix.target }}

      - name: Point at the freshly built libraries
        if: needs.linux-windows.result == 'success'
        shell: cmd
        run: go mod edit -replace %LIBS_MOD%=${{ runner.temp }}\libs\${{ matrix.target }}

      # Without the replace, the module resolves to the published release.
      - name: Fetch the published libraries
        if: needs.linux-windows.result != 'success'
        shell: cmd
        run: go mod download %LIBS_MOD%

      # Prove it: say which libraries the suite is about to link — the replace
      # directory when the matrix ran, the module cache otherwise. purego
      # resolves the shared library relative to the working directory, so stage
      # it from that same place.
      - name: Stage the shared library for purego
        shell: pwsh
        run: |
          $dir = go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' $env:LIBS_MOD
          go list -m -f '{{.Path}} {{.Version}} => {{with .Replace}}{{.Dir}}{{end}}' $env:LIBS_MOD
          Write-Output "::notice::testing against $dir"
          $dll = Join-Path $dir "lib\libgoffmpeg.dll"
          if (-not (Test-Path $dll)) { throw "no shared library at $dll" }
          $dst = "internal\libav\dist\${{ matrix.target }}\lib"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item $dll $dst

      # Windows has no rpath. A binary go test builds, and the bridge purego
      # loads, find the FFmpeg DLLs through PATH: the module's shared/, as a
      # developer sets it (BUILDING.md, #40). A package puts them beside the
      # executable instead.
      - name: Put the FFmpeg DLLs on PATH
        shell: pwsh
        run: |
          $dir = go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' $env:LIBS_MOD
          $shared = Join-Path $dir "shared"
          if (-not (Test-Path $shared)) { throw "no shared/ in $dir" }
          Write-Output "::notice::FFmpeg DLLs from $shared"
          Add-Content -Path $env:GITHUB_PATH -Value $shared
          # The audio codec set (#41), for the audio-only tests. Its DLLs are
          # named -goffmpeg-audio, so both sets can be on PATH at once.
          $audio = Join-Path $dir "shared-audio"
          if (Test-Path $audio) {
            Write-Output "::notice::audio-set DLLs from $audio"
            Add-Content -Path $env:GITHUB_PATH -Value $audio
          }

      # The shared FFmpeg DLLs, cross-built on Linux, run on Windows: they
      # load, find each other beside the executable, and decode a file, for
      # both codec sets. Only when the matrix ran: it tests the DLLs just built.
      - name: Smoke-test the shared libraries
        if: needs.linux-windows.result == 'success'
        shell: bash
        env:
          SMOKE_CC: ${{ matrix.smoke_cc }}
          SMOKE_RUN: "1"
          INCLUDE: internal/libav/include
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          sh scripts/smoke-shared.sh ${{ matrix.target }} "$tmp/libs/${{ matrix.target }}/shared" \
            "$tmp/smoke" "$PWD/testdata/sample.mp4"
          SMOKE_SET=audio sh scripts/smoke-shared.sh ${{ matrix.target }} "$tmp/libs/${{ matrix.target }}/shared-audio" \
            "$tmp/smoke-audio" "$PWD/testdata/sample_cover.mp3"

      - name: Test (cgo)
        shell: cmd
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          GOFLAGS: -mod=mod
        run: go test -count=1 -v ./...

      - name: Test (cgo, audio only)
        shell: cmd
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          GOFLAGS: -mod=mod
        run: go test -count=1 -v -tags goffmpeg_novideo -run "NoVideo|AudioSet|TestBuiltCodecsAreTheSet|TestNoDecoderForADPCM|TestCodecSetPlaysWAV|TestLinksSharedFFmpeg" .

      - name: Test (purego)
        shell: cmd
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=mod
        run: go test -count=1 -v ./...

  linux-arm64:
    name: linux_arm64
    needs: should-build
    if: needs.should-build.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Fetch FFmpeg
        run: |
          rm -rf ../ffmpeg && git clone --filter=blob:none "$FFMPEG_REPO" ../ffmpeg
          git -C ../ffmpeg checkout --detach "$FFMPEG_REF"

      # Built on Ubuntu 22.04, whose glibc 2.35 is the oldest goffmpeg supports
      # (#44): a shared library needs at least the glibc it was built against,
      # and this runner's Ubuntu 24.04 has 2.39. check-shared and bridge-shared
      # fail a file that needs more. The smoke test and the shared bridge are
      # built there too; the tests below then exercise both backends.
      # The hosted runner has no v4l2 device, so the capture tests skip here;
      # the reopen test below says so in the log rather than passing silently.
      - name: Build linux_arm64 on Ubuntu 22.04
        run: |
          make linux-docker TARGET=linux_arm64 DOCKER_GOALS="dist smoke-shared bridge-shared SMOKE_RUN=1"
          make linux-docker TARGET=linux_arm64 DOCKER_GOALS="dist smoke-shared SET=audio SMOKE_RUN=1"

      # Without this the tests below link the *published* companion module, not
      # the FFmpeg this job just built — libav_linux_arm64.go blank-imports
      # goffmpeg-libs/linux_arm64, and its cgo link flags resolve ${SRCDIR}
      # into the module cache.
      #
      # So this leg built FFmpeg and then tested a different one. Every other
      # job does the replace for its link check; this is the only one that runs
      # a real suite, and it was the one missing it. That is how a patch to
      # FFmpeg could be compiled here (`CC libavdevice/v4l2.o`) and have no
      # effect on the tests — which is exactly what happened while
      # investigating #14, and cost a wrong conclusion about patches/0001.
      - name: Point the tests at the libraries just built
        run: |
          rm -rf "$RUNNER_TEMP/libs"
          git clone --depth 1 https://github.com/belluikit/goffmpeg-libs.git "$RUNNER_TEMP/libs"
          make sync-libs TARGET=linux_arm64 LIBS_REPO="$RUNNER_TEMP/libs"
          go mod edit -replace \
            github.com/belluikit/goffmpeg-libs/linux_arm64="$RUNNER_TEMP/libs/linux_arm64"
          # Prove it: the replace must resolve to the clone, not the cache.
          go list -m -f '{{.Path}} => {{with .Replace}}{{.Dir}}{{end}}' \
            github.com/belluikit/goffmpeg-libs/linux_arm64

      # The #14 regression, run on its own and verbosely.
      #
      # Its own process because it needs the first device open of the process to
      # be its own — an earlier test opening the same camera would leave the
      # node in the state the bug is about.
      #
      # Verbose because `go test` buffers a package's output and discards it
      # when the package passes, so a skip and a pass look identical from the
      # outside. This test skipping when no camera is attached is expected — and
      # on a hosted runner it always skips, so a green tick here is not evidence
      # about #14. It skipping silently while everyone reads the green tick as
      # proof of the fix is how #14 nearly got closed on a run that never
      # touched a device.
      #
      # These run on Ubuntu 22.04, the glibc floor (scripts/linux-floor.sh).
      - name: Test v4l2 reopen (#14)
        run: scripts/linux-floor.sh 'go test -count=1 -v -run TestOpenDeviceV4L2Reopen .'

      - name: Test (cgo)
        run: |
          scripts/linux-floor.sh '
            go test -race -count=1 ./...
            go test -count=1 -v -run "TestLinksSharedFFmpeg|TestVideoImportsSwscale" .
            go test -count=1 -v -tags goffmpeg_novideo -run "NoVideo|AudioSet|TestBuiltCodecsAreTheSet|TestNoDecoderForADPCM|TestCodecSetPlaysWAV|TestLinksSharedFFmpeg" .'

      - name: Test (purego)
        run: scripts/linux-floor.sh 'CGO_ENABLED=0 go test -count=1 ./...'

      # Leave the checkout as it was found; the replace is for this job only.
      - name: Restore go.mod
        if: always()
        run: git checkout go.mod

      - uses: actions/upload-artifact@v7
        with:
          name: libav-linux_arm64
          path: internal/libav/dist/linux_arm64
          retention-days: 14
